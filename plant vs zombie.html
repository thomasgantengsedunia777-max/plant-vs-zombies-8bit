<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plants vs Zombies</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
const C=document.getElementById('gc'),X=C.getContext('2d');
const AC=window.AudioContext||window.webkitAudioContext;
let ac,mp=false;
function iA(){if(!ac)ac=new AC();if(ac.state==='suspended')ac.resume();if(!mp){mp=true;pM();}}
function pN(f,d,t='sine',v=.06,dl=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime+dl);g.gain.setValueAtTime(v,ac.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dl+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+dl);o.stop(ac.currentTime+dl+d);}
function sfxShoot(){pN(800,.08,'square',.04);pN(600,.06,'square',.03,.03);}
function sfxSun(){pN(1200,.1,'sine',.05);pN(1500,.1,'sine',.04,.05);pN(1800,.08,'sine',.03,.1);}
function sfxPlant(){pN(400,.15,'sine',.05);pN(500,.1,'sine',.04,.08);}
function sfxChomp(){pN(200,.12,'sawtooth',.03);pN(150,.1,'sawtooth',.02,.05);}
function sfxBigChomp(){pN(150,.3,'sawtooth',.08);pN(100,.25,'square',.06,.1);pN(80,.4,'sawtooth',.05,.2);}
function sfxMower(){pN(100,.8,'sawtooth',.07);pN(120,.6,'square',.05,.1);}
function sfxDie(){pN(300,.2,'sawtooth',.04);pN(200,.3,'sawtooth',.03,.1);pN(100,.4,'sawtooth',.02,.2);}
function sfxAsh(){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*.4|0,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*.5;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);s.connect(g);g.connect(ac.destination);s.start();pN(200,.2,'sawtooth',.03);}
function sfxBoom(){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*.4|0,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.setValueAtTime(.13,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);s.connect(g);g.connect(ac.destination);s.start();}
function sfxClick(){pN(600,.05,'square',.04);}
function sfxArmorFall(){pN(150,.15,'sawtooth',.06);pN(120,.1,'square',.04,.08);pN(90,.2,'sawtooth',.05,.15);}
function sfxBucketFall(){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*.3|0,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.2)*.6;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);s.connect(g);g.connect(ac.destination);s.start();pN(400,.1,'square',.05);pN(300,.15,'square',.04,.05);}
function sfxBowling(){pN(200,.15,'square',.05);pN(180,.1,'sawtooth',.04,.08);}
function sfxBounce(){pN(500,.08,'sine',.05);pN(700,.06,'sine',.03,.05);}
function sfxLose(){[400,350,300,200].forEach((f,i)=>pN(f,.4,'sawtooth',.04,i*.2));}
function sfxVictory(){
const m=[523,523,659,784,659,784,1047,0,784,659,523,659,587,523,494,523];
m.forEach((f,i)=>{if(f>0){pN(f,.22,'sine',.05,i*.18);pN(f/2,.22,'triangle',.02,i*.18);}});
[131,165,196,131,165,196,131,196].forEach((f,i)=>pN(f,.3,'triangle',.025,i*.36));}
let mTi=null;
function pM(){if(!ac||!mp)return;const bpm=95,bt=60/bpm;
const mel=[{n:523,d:.5},{n:659,d:.5},{n:784,d:.5},{n:659,d:.5},{n:587,d:.5},{n:523,d:.5},{n:494,d:.5},{n:523,d:1},{n:440,d:.5},{n:523,d:.5},{n:659,d:.5},{n:587,d:.5},{n:523,d:.5},{n:494,d:.5},{n:440,d:.5},{n:494,d:1},{n:523,d:.5},{n:587,d:.5},{n:659,d:1},{n:587,d:.5},{n:523,d:.5},{n:494,d:.5},{n:440,d:.5},{n:392,d:.5},{n:440,d:1},{n:349,d:.5},{n:392,d:.5},{n:440,d:.5},{n:523,d:.5},{n:494,d:.5},{n:440,d:.5},{n:392,d:.5},{n:523,d:1}];
let t=0;mel.forEach(n=>{pN(n.n,n.d*bt*.9,'sine',.025,t);pN(n.n/2,n.d*bt*.9,'triangle',.01,t);t+=n.d*bt;});
mTi=setTimeout(()=>{if(mp)pM();},t*1000-100);}

let W=1280,H=720,scl=1,oX=0,oY=0,rot=0;
function rsz(){const sw=window.innerWidth,sh=window.innerHeight;C.width=sw;C.height=sh;if(sw<sh){rot=Math.PI/2;scl=Math.min(sh/W,sw/H);}else{rot=0;scl=Math.min(sw/W,sh/H);}oX=sw/2;oY=sh/2;}
rsz();window.addEventListener('resize',rsz);
function tI(ex,ey){let x=ex-oX,y=ey-oY;if(rot){const c=Math.cos(-rot),s=Math.sin(-rot);const rx=x*c-y*s,ry=x*s+y*c;x=rx;y=ry;}return{x:x/scl+W/2,y:y/scl+H/2};}

const ROWS=5,COLS=9,CW=85,CH=88,GX=260,GY=115;
const LAWN_RIGHT=GX+COLS*CW;
const BOWLING_LIMIT_COL=3;

// === KEEP SAME LOCALSTORAGE KEYS so progress is preserved ===
let st='menu',lv=0,maxLv=parseInt(localStorage.getItem('pvzF_ml'))||0;
let uP=JSON.parse(localStorage.getItem('pvzF_up'))||['peashooter'];
let sn=50,sel=null,grid=[],zL=[],bL=[],sL=[],mw=[],pt=[],boomFx=[],fallenArmor=[],ashes=[],bowlingBalls=[];
let wT=0,cW=0,aS=false,gT=0,mx=0,my=0,af=0;
let winSt=0,winTm=0,trophyX=0,trophyY=0,trophyClicked=false,rewardP='',lastZombiePos=null;
let tutStep=0,tutMsg='';
let bowlingMode=false,bowlingDeck=[],bowlingCurrent=null,bowlingNextTimer=0;
let menuStars=[];for(let i=0;i<60;i++)menuStars.push({x:Math.random()*W,y:Math.random()*350,s:Math.random()*2.5+.5,b:Math.random()*100});

const PD={
peashooter:{name:'Peashooter',cost:100,hp:100,shootInt:85,dmg:40},
sunflower:{name:'Sunflower',cost:50,hp:100,sunInt:240},
cherrybomb:{name:'Cherry Bomb',cost:150,hp:100,boom:1},
wallnut:{name:'Wall-nut',cost:50,hp:500},
potatomine:{name:'Potato Mine',cost:25,hp:100,armTime:1200,boomR:2},
snowpea:{name:'Snow Pea',cost:175,hp:100,shootInt:85,dmg:40,slow:1},
chomper:{name:'Chomper',cost:150,hp:100,chompTime:1200,dmg:Infinity}
};

const LVLS=[
{rows:1,plants:['peashooter'],waves:[[{t:'normal',n:2,iv:260}],[{t:'normal',n:3,iv:200}]],reward:'sunflower',name:'Tutorial'},
{rows:5,plants:null,waves:[[{t:'normal',n:3,iv:220}],[{t:'normal',n:5,iv:170}],[{t:'normal',n:8,iv:130}]],reward:'cherrybomb',name:'Level 1'},
{rows:5,plants:null,waves:[[{t:'normal',n:5,iv:160}],[{t:'normal',n:4,iv:130},{t:'cone',n:2,iv:210}],[{t:'normal',n:6,iv:100},{t:'cone',n:4,iv:150}]],reward:'wallnut',name:'Level 2'},
{rows:5,plants:null,waves:[[{t:'normal',n:6,iv:130},{t:'cone',n:2,iv:200}],[{t:'cone',n:4,iv:120},{t:'bucket',n:1,iv:300}],[{t:'normal',n:8,iv:90},{t:'cone',n:4,iv:120},{t:'bucket',n:2,iv:200}]],reward:'potatomine',name:'Level 3'},
{rows:5,plants:null,waves:[[{t:'normal',n:6,iv:110},{t:'cone',n:3,iv:160}],[{t:'cone',n:5,iv:100},{t:'bucket',n:2,iv:200}],[{t:'normal',n:10,iv:75},{t:'cone',n:5,iv:100},{t:'bucket',n:3,iv:150}]],reward:'snowpea',name:'Level 4'},
{rows:5,plants:null,waves:[[{t:'normal',n:8,iv:90},{t:'cone',n:4,iv:130},{t:'bucket',n:2,iv:190}],[{t:'cone',n:6,iv:85},{t:'bucket',n:4,iv:130}],[{t:'normal',n:12,iv:65},{t:'cone',n:6,iv:85},{t:'bucket',n:5,iv:110}]],reward:'chomper',name:'Level 5'},
{rows:5,plants:null,bowling:true,waves:[[{t:'normal',n:5,iv:200}],[{t:'normal',n:6,iv:150},{t:'cone',n:2,iv:220}],[{t:'normal',n:8,iv:120},{t:'cone',n:4,iv:150},{t:'bucket',n:2,iv:250}]],reward:null,name:'Bowling'}
];
const ZD={normal:{hp:100,spd:.32,dmg:8,ahp:0},cone:{hp:150,spd:.32,dmg:8,ahp:75},bucket:{hp:230,spd:.27,dmg:8,ahp:130}};

C.addEventListener('mousemove',e=>{const p=tI(e.clientX,e.clientY);mx=p.x;my=p.y;});
C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const p=tI(t.clientX,t.clientY);mx=p.x;my=p.y;},{passive:false});
C.addEventListener('click',e=>{iA();const p=tI(e.clientX,e.clientY);mx=p.x;my=p.y;doClick(p.x,p.y);});
C.addEventListener('touchstart',e=>{e.preventDefault();iA();const t=e.touches[0];const p=tI(t.clientX,t.clientY);mx=p.x;my=p.y;doClick(p.x,p.y);},{passive:false});

function doClick(x,y){
if(st==='menu'){if(x>W/2-120&&x<W/2+120&&y>H/2+50&&y<H/2+120){sfxClick();st='lvlSel';}return;}
if(st==='lvlSel'){if(x>20&&x<140&&y>20&&y<68){sfxClick();st='menu';return;}
for(let i=0;i<LVLS.length;i++){const bx=W/2-260+(i%6)*105,by=H/2-30+Math.floor(i/6)*130;
if(x>bx-44&&x<bx+44&&y>by-44&&y<by+44&&i<=maxLv){sfxClick();lv=i;startLvl();}}return;}
if(st==='win'){
if(winSt===0&&!trophyClicked){
if(x>trophyX-50&&x<trophyX+50&&y>trophyY-60&&y<trophyY+40){trophyClicked=true;winSt=1;winTm=0;sfxVictory();}return;}
if(winSt>=3){sfxClick();st='lvlSel';}return;}
if(st==='lose'){const cx=W/2,cy=H/2;
if(x>cx-95&&x<cx+95&&y>cy+20&&y<cy+60){sfxClick();startLvl();return;}
if(x>cx-95&&x<cx+95&&y>cy+70&&y<cy+110){sfxClick();st='lvlSel';}return;}
if(st==='game'){
if(bowlingMode){
if(bowlingCurrent){
const gc=Math.floor((x-GX)/CW),gRow=Math.floor((y-curGY())/CH),rows=curRows();
if(gc>=0&&gc<BOWLING_LIMIT_COL&&gRow>=0&&gRow<rows){
launchBowling(bowlingCurrent,gRow,gc);
bowlingCurrent=null;
bowlingNextTimer=60;
sfxBowling();
}}
return;
}
for(let i=sL.length-1;i>=0;i--){const s=sL[i];if((x-s.x)**2+(y-s.y)**2<900){sn+=50;sL.splice(i,1);sfxSun();return;}}
const ap=getAP();for(let i=0;i<ap.length;i++){const px=22+i*78,py=8;
if(x>px&&x<px+72&&y>py&&y<py+95){if(sn>=PD[ap[i]].cost){sel=sel===ap[i]?null:ap[i];sfxClick();}return;}}
if(sel){const gc=Math.floor((x-GX)/CW),gRow=Math.floor((y-curGY())/CH),rows=curRows();
if(gc>=0&&gc<COLS&&gRow>=0&&gRow<rows&&!grid[gRow][gc]){const d=PD[sel];
if(sn>=d.cost){sn-=d.cost;
const p={type:sel,row:gRow,col:gc,hp:d.hp,mhp:d.hp,t:0,x:GX+gc*CW+CW/2,y:curGY()+gRow*CH+CH/2,shake:0,armed:sel!=='potatomine',armT:sel==='potatomine'?PD.potatomine.armTime:0,underground:sel==='potatomine',chomping:false,chompT:0,zombieInMouth:null};
grid[gRow][gc]=p;sfxPlant();
if(d.boom&&sel==='cherrybomb')setTimeout(()=>doCBExplode(p),1000);
sel=null;}}}}}

function getAP(){const ld=LVLS[lv];return ld.plants?ld.plants.filter(p=>PD[p]):uP.filter(p=>PD[p]);}
function curRows(){return LVLS[lv]?LVLS[lv].rows:5;}
function curGY(){const r=curRows();return r===1?H/2-CH/2:GY;}

function startLvl(){
st='game';sn=50;sel=null;grid=[];zL=[];bL=[];sL=[];mw=[];pt=[];boomFx=[];fallenArmor=[];ashes=[];bowlingBalls=[];
wT=lv===0?200:350;cW=0;aS=false;gT=0;winSt=0;winTm=0;trophyClicked=false;rewardP='';lastZombiePos=null;tutStep=0;
const ld=LVLS[lv];
bowlingMode=!!ld.bowling;
bowlingDeck=[];bowlingCurrent=null;bowlingNextTimer=60;
if(bowlingMode){generateNextBall();tutMsg='Click on the lawn to roll the wall-nut!';}
else{tutMsg=lv===0?'Select Peashooter card, then place on lawn!':'';}
const rows=curRows(),gy=curGY();
for(let r=0;r<rows;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=null;}
for(let r=0;r<rows;r++)mw.push({row:r,x:GX-55,y:gy+r*CH+CH/2,active:false,spd:6,exists:true});}

function generateNextBall(){
const r=Math.random();
if(r<.5)bowlingCurrent='wallnut';
else if(r<.8)bowlingCurrent='bombnut';
else bowlingCurrent='giantnut';
}

function launchBowling(type,row,col){
const startX=GX+col*CW+CW/2;
const startY=curGY()+row*CH+CH/2;
const ball={type:type,x:startX,y:startY,row:row,vx:8+Math.random()*2,vy:0,rotation:0,bouncesLeft:type==='wallnut'?3:0,hp:type==='giantnut'?2000:500,size:type==='giantnut'?38:type==='bombnut'?28:25,exploded:false};
bowlingBalls.push(ball);
}

// === ASH EFFECT for explosive deaths only ===
function zombieToAsh(z){
sfxAsh();
if(z.ahp>0&&!z.armorDropped){dropArmor(z);z.armorDropped=true;}
for(let i=0;i<40;i++){
ashes.push({x:z.x+(Math.random()-.5)*30,y:z.y+(Math.random()-.5)*45-10,vx:(Math.random()-.5)*3,vy:-Math.random()*2.5-.5,size:3+Math.random()*5,life:80+Math.random()*50,ml:130,color:Math.random()>.7?'#444':Math.random()>.4?'#555':'#666',settled:false,groundY:z.y+25+Math.random()*5});
}
for(let i=0;i<18;i++){
pt.push({x:z.x+(Math.random()-.5)*25,y:z.y-20+(Math.random()-.5)*20,vx:(Math.random()-.5)*2.5,vy:-Math.random()*3-1,life:50+Math.random()*20,ml:70,color:Math.random()>.5?'#888':'#777',sz:6+Math.random()*8});
}
for(let i=0;i<8;i++){
ashes.push({x:z.x+(Math.random()-.5)*20,y:z.y-10+(Math.random()-.5)*20,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,size:5+Math.random()*4,life:100+Math.random()*30,ml:130,color:'#333',settled:false,groundY:z.y+25+Math.random()*5});
}
}

// === Mark zombies for ash death (explosion sources) ===
function doCBExplode(p){if(!p||!grid[p.row]||grid[p.row][p.col]!==p)return;sfxBoom();
boomFx.push({x:p.x,y:p.y,t:60,mt:60,big:true});
for(const z of zL)if(Math.abs(z.x-p.x)<CW*1.6&&Math.abs(z.y-p.y)<CH*1.6){z.hp=-999;z.killedByExplosion=true;}
for(let i=0;i<55;i++)pt.push({x:p.x,y:p.y,vx:(Math.random()-.5)*18,vy:(Math.random()-.5)*18,life:50+Math.random()*30,ml:80,color:Math.random()>.5?'#FF3333':'#FF8800',sz:6+Math.random()*14});
grid[p.row][p.col]=null;}

function doPMExplode(p){if(!p)return;sfxBoom();boomFx.push({x:p.x,y:p.y,t:60,mt:60,big:false});
for(const z of zL){const zc=Math.floor((z.x-GX)/CW);if(Math.abs(zc-p.col)<2&&Math.abs(z.row-p.row)<2){z.hp=-999;z.killedByExplosion=true;}}
for(let i=0;i<40;i++)pt.push({x:p.x,y:p.y,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,life:45+Math.random()*25,ml:70,color:Math.random()>.4?'#8B4513':'#FF6600',sz:5+Math.random()*12});
if(grid[p.row])grid[p.row][p.col]=null;}

function doBombnutExplode(ball){
sfxBoom();
boomFx.push({x:ball.x,y:ball.y,t:60,mt:60,big:true});
for(const z of zL){const zRow=z.row;if(Math.abs(z.x-ball.x)<CW*1.5&&Math.abs(zRow-ball.row)<=1){z.hp=-999;z.killedByExplosion=true;}}
for(let i=0;i<60;i++)pt.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*18,vy:(Math.random()-.5)*18,life:50+Math.random()*30,ml:80,color:Math.random()>.5?'#FF3333':'#FF8800',sz:7+Math.random()*15});
ball.exploded=true;
}

function spawnZ(type,row){const d=ZD[type];
zL.push({type,hp:d.hp,mhp:d.hp,ahp:d.ahp,mahp:d.ahp,spd:d.spd,dmg:d.dmg,row,
x:GX+COLS*CW+60+Math.random()*120,y:curGY()+row*CH+CH/2,
eating:false,et:0,wa:Math.random()*7,dying:false,dt:0,
aFall:false,aFallY:0,aFallVY:0,aFallX:0,aFallVX:0,aFallR:0,aFallVR:0,aFallBounces:0,armFY:0,armOff:false,slowed:false,slowT:0,slowCol:false,eatenByChomper:false,armorDropped:false,killedByExplosion:false});}

function spawnWave(){const ld=LVLS[lv];if(!ld||cW>=ld.waves.length){aS=true;return;}
const w=ld.waves[cW];let td=0;const rows=curRows();
for(const g of w){for(let i=0;i<g.n;i++){const dl=td+i*g.iv;
setTimeout(()=>{if(st==='game')spawnZ(g.t,Math.floor(Math.random()*rows));},dl*1000/60);}td+=g.n*g.iv;}
cW++;if(cW>=ld.waves.length)aS=true;wT=td+700;}

function dropArmor(z){
const armorType=z.type;
if(armorType==='normal')return;
const startX=z.x;
const startY=z.y-26;
const vx=-2-Math.random()*3;
const vy=-3-Math.random()*2;
const vr=(Math.random()-.5)*.3;
fallenArmor.push({type:armorType,x:startX,y:startY,vx:vx,vy:vy,rotation:0,vr:vr,groundY:z.y+15,bounces:0,maxBounces:2,life:200,settled:false});
sfxArmorFall();
if(armorType==='bucket')sfxBucketFall();
}

function update(){
af++;
if(st==='win'){winTm++;return;}
if(st!=='game')return;
gT++;wT--;
if(wT<=0&&!aS)spawnWave();

if(bowlingMode&&!bowlingCurrent){
bowlingNextTimer--;
if(bowlingNextTimer<=0){generateNextBall();bowlingNextTimer=60;}
}

if(zL.length>0){
const alive=zL.filter(z=>!z.dying);
if(alive.length>0){const last=alive.reduce((a,b)=>a.x<b.x?a:b);lastZombiePos={x:last.x,y:last.y};}
else if(!lastZombiePos){const d=zL[0];lastZombiePos={x:d.x,y:d.y};}}

if(aS&&zL.length===0&&gT>350){
st='win';winSt=0;winTm=0;trophyClicked=false;
const ld=LVLS[lv];rewardP=ld.reward||'';
if(lastZombiePos){trophyX=lastZombiePos.x;trophyY=lastZombiePos.y;}
else{trophyX=W/2;trophyY=H/2;}
trophyX=Math.max(200,Math.min(W-100,trophyX));
trophyY=Math.max(150,Math.min(H-100,trophyY));
if(lv>=maxLv&&lv<LVLS.length-1){maxLv=lv+1;localStorage.setItem('pvzF_ml',maxLv);}
if(ld.reward&&!uP.includes(ld.reward)){uP.push(ld.reward);localStorage.setItem('pvzF_up',JSON.stringify(uP));}
return;}

if(lv===0){
if(tutStep===0&&grid[0]&&grid[0].some(c=>c)){tutStep=1;tutMsg='Zombies incoming! Peashooter shoots automatically!';}
if(tutStep===1&&zL.length===0&&gT>500)tutMsg='';}

if(!bowlingMode&&gT%520===0){const gy=curGY(),rows=curRows();
sL.push({x:GX+Math.random()*(COLS*CW),y:gy-40,ty:gy+Math.random()*(rows*CH),spd:.6,life:550,sc:1});}
for(let i=sL.length-1;i>=0;i--){const s=sL[i];if(s.y<s.ty)s.y+=s.spd;else{s.life--;if(s.life<=50)s.sc=s.life/50;}if(s.life<=0)sL.splice(i,1);}
for(let i=boomFx.length-1;i>=0;i--){boomFx[i].t--;if(boomFx[i].t<=0)boomFx.splice(i,1);}

if(a.y>=a.groundY&&a.vy>0){
a.bounces++;

else{a.y=a.groundY;a.vy=-a.vy*.5;a.vx*=.7;a.vr*=.5;}

b.x+=b.vx;
b.rotation+=b.vx*.05;
for(const z of zL){
if(z.row===b.row&&!z.dying&&Math.abs(z.x-b.x)<b.size+10){

if(p.type==='chomper'){

const p=Math.min(1,winTm/60);drawGame();X.fillStyle=`rgba(255,255,255,${p})`;X.fillRect(0,0,W,H);
if(winTm>=60){winSt=2;winTm=60;}
}else if(winSt===2){
const p=Math.min(1,(winTm-60)/40);X.fillStyle='#FFFFFF';X.fillRect(0,0,W,H);
if(p>=1){winSt=3;}
X.globalAlpha=p;
X.fillStyle='#333';X.font='bold 46px Arial Black,Arial';X.textAlign='center';X.fillText('CONGRATULATIONS!',cx,cy-140);
X.fillStyle='#FFD700';X.font='bold 30px Arial';X.fillText('★ ★ ★',cx,cy-90);
if(rewardP&&PD[rewardP]){
X.fillStyle='#555';X.font='bold 22px Arial';X.fillText('You earned a new plant:',cx,cy-40);
X.fillStyle='#2E7D32';X.font='bold 32px Arial Black,Arial';X.fillText(PD[rewardP].name+'!',cx,cy+70);
dMini(rewardP,cx,cy+140,1.8);
}else{X.fillStyle='#555';X.font='bold 22px Arial';X.fillText('Level Complete!',cx,cy+20);}
X.globalAlpha=1;
}else{
X.fillStyle='#FFFFFF';X.fillRect(0,0,W,H);
X.fillStyle='#333';X.font='bold 46px Arial Black,Arial';X.textAlign='center';X.fillText('CONGRATULATIONS!',cx,cy-140);
X.fillStyle='#FFD700';X.font='bold 30px Arial';X.fillText('★ ★ ★',cx,cy-90);
if(rewardP&&PD[rewardP]){
X.fillStyle='#555';X.font='bold 22px Arial';X.fillText('You earned a new plant:',cx,cy-40);
X.fillStyle='#2E7D32';X.font='bold 32px Arial Black,Arial';X.fillText(PD[rewardP].name+'!',cx,cy+70);
dMini(rewardP,cx,cy+140,1.8);
}else{X.fillStyle='#555';X.font='bold 22px Arial';X.fillText('Level Complete!',cx,cy+20);}
X.fillStyle='rgba(0,0,0,.35)';X.font='16px Arial';X.fillText('Click anywhere to continue',cx,H-40);}}

function drawLose(){
drawGame();X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,0,W,H);
const cx=W/2,cy=H/2;
X.fillStyle='rgba(60,15,15,.92)';rr(cx-220,cy-100,440,240,22);X.fill();X.strokeStyle='#F44336';X.lineWidth=3;rr(cx-220,cy-100,440,240,22);X.stroke();
X.fillStyle='#F44336';X.font='bold 46px Arial Black,Arial';X.textAlign='center';X.fillText('GAME OVER',cx,cy-40);
X.fillStyle='#CCC';X.font='18px Arial';X.fillText('The zombies ate your brains!',cx,cy);
const b1h=mx>cx-95&&mx<cx+95&&my>cy+20&&my<cy+60;
X.fillStyle=b1h?'#EF5350':'#D32F2F';rr(cx-95,cy+25,190,38,10);X.fill();X.fillStyle='#FFF';X.font='bold 19px Arial';X.fillText('Retry',cx,cy+49);
const b2h=mx>cx-95&&mx<cx+95&&my>cy+70&&my<cy+110;
X.fillStyle=b2h?'#555':'#333';rr(cx-95,cy+75,190,38,10);X.fill();X.fillStyle='#FFF';X.font='bold 19px Arial';X.fillText('Menu',cx,cy+99);}

function draw(){
X.save();X.translate(oX,oY);X.rotate(rot);X.scale(scl,scl);X.translate(-W/2,-H/2);
X.clearRect(0,0,W,H);
switch(st){case'menu':drawMenu();break;case'lvlSel':drawLvlSel();break;case'game':drawGame();break;case'win':drawWin();break;case'lose':drawLose();break;}
X.restore();}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
